<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d11" />
  <meta name="description" content="Tu entrenador de gimnasio y dieta personalizada según tu edad, peso y estatura." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>GymFit — Rutina y Dieta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0d11;
      --surface: #12151b;
      --line: #222834;
      --txt: #e9edf2;
      --muted: #8a93a2;
      --accent: #5eead4;
      --accent-ink: #06211b;
      --amber: #f0c983;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      line-height: 1.6;
      padding-bottom: 96px;
      font-size: 15px;
    }
    .container { max-width: 560px; margin: 0 auto; padding: 28px 20px 0; }

    /* ---- header ---- */
    header.app { margin-bottom: 28px; }
    header.app h1 {
      font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em;
    }
    header.app h1 span { color: var(--accent); }
    header.app p { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }

    /* ---- primitives ---- */
    .micro {
      font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--muted);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
    }
    .card > .micro { display: block; margin-bottom: 14px; }
    .mutedtext { color: var(--muted); font-size: 0.86rem; }
    a { color: var(--accent); }

    .view { display: none; }
    .view.active { display: block; animation: fade .22s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none;} }

    /* ---- hero (hoy) ---- */
    .hero h2 { font-size: 1.55rem; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 2px; }
    .hero .sub { color: var(--muted); font-size: 0.86rem; }
    .hero .meta {
      display: flex; gap: 20px; margin-top: 16px; padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .hero .meta div b { display: block; font-size: 0.9rem; font-weight: 600; color: var(--txt); }
    .hero .meta div span { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

    /* ---- semana / días ---- */
    .day { border-bottom: 1px solid var(--line); }
    .day:last-child { border-bottom: none; }
    .day .head {
      display: flex; align-items: center; gap: 16px;
      padding: 15px 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .day .num {
      font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums;
      width: 20px; flex-shrink: 0;
    }
    .day.today .num { color: var(--accent); }
    .day .info { flex: 1; min-width: 0; }
    .day .info strong { display: block; font-size: 0.95rem; font-weight: 600; }
    .day .info small { color: var(--muted); font-size: 0.78rem; }
    .day .mark { font-size: 0.68rem; color: var(--accent); letter-spacing: 0.1em; font-weight: 600; }
    .day .chev {
      width: 8px; height: 8px; flex-shrink: 0;
      border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
      transform: rotate(45deg); transition: transform .2s; margin-left: 4px;
    }
    .day.open .chev { transform: rotate(225deg); }
    .day .body { display: none; padding: 0 0 14px 36px; }
    .day.open .body { display: block; }
    .ex {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      padding: 8px 0;
    }
    .ex .n { font-size: 0.88rem; }
    .ex .n small { display: block; color: var(--muted); font-size: 0.74rem; }
    .ex .sr {
      color: var(--accent); font-size: 0.82rem; font-weight: 500;
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }

    /* ---- dieta ---- */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 16px; }
    .stat .v { font-size: 1.7rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
    .stat .v em { font-style: normal; font-size: 0.8rem; color: var(--muted); font-weight: 500; margin-left: 2px; }
    .stat .l { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }
    .imc-bar {
      height: 4px; border-radius: 999px; margin-top: 20px; position: relative;
      background: linear-gradient(90deg, #6d9fd8 0 18.5%, #6fbf9a 18.5% 50%, #d8bb7c 50% 75%, #cf8080 75%);
      opacity: 0.9;
    }
    .imc-dot {
      position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%;
      background: #fff; transform: translateX(-50%);
    }
    .imc-cat { margin-top: 10px; font-size: 0.8rem; color: var(--muted); }
    .imc-cat b { color: var(--txt); font-weight: 600; }

    .macros { display: flex; }
    .macro { flex: 1; }
    .macro + .macro { border-left: 1px solid var(--line); padding-left: 18px; }
    .macro b { display: block; font-size: 1.25rem; font-weight: 650; letter-spacing: -0.02em; }
    .macro b em { font-style: normal; font-size: 0.75rem; color: var(--muted); font-weight: 500; }
    .macro span { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

    .chips {
      display: flex; gap: 6px; margin-bottom: 16px;
    }
    .chip {
      flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid var(--line);
      background: none; color: var(--muted); font-family: inherit; font-size: 0.74rem;
      font-weight: 600; cursor: pointer; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .meal { padding: 13px 0; border-bottom: 1px solid var(--line); }
    .meal:last-of-type { border-bottom: none; padding-bottom: 4px; }
    .meal b {
      display: block; font-size: 0.7rem; font-weight: 600; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 3px;
    }
    .meal p { color: #c3cad5; font-size: 0.87rem; }

    .notice {
      border: 1px solid var(--line); border-left: 2px solid var(--amber);
      border-radius: 14px; padding: 14px 16px; font-size: 0.82rem;
      color: var(--muted); margin-bottom: 16px;
    }
    .notice b { color: var(--amber); font-weight: 600; }

    /* ---- forms ---- */
    label {
      display: block; font-size: 0.68rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 6px;
    }
    input, select {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--bg);
      color: var(--txt); font-size: 0.95rem; font-family: inherit;
      appearance: none; -webkit-appearance: none;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 19px) 50%, calc(100% - 14px) 50%;
      background-size: 5px 5px; background-repeat: no-repeat; }
    select option { background: var(--surface); color: var(--txt); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    button.primary {
      width: 100%; margin-top: 26px; padding: 14px;
      background: var(--accent); border: none; border-radius: 999px;
      color: var(--accent-ink); font-weight: 650; font-size: 0.95rem;
      font-family: inherit; cursor: pointer; letter-spacing: -0.01em;
    }
    button.primary:active { transform: scale(0.98); }
    button.ghost {
      width: 100%; margin-top: 12px; padding: 13px;
      background: none; border: 1px solid var(--line); border-radius: 999px;
      color: var(--txt); font-weight: 550; font-size: 0.9rem;
      font-family: inherit; cursor: pointer;
    }

    .center-msg { text-align: center; padding: 28px 10px; }
    .center-msg p { color: var(--muted); font-size: 0.9rem; }
    #installBtn { display: none; }
    footer {
      text-align: center; color: var(--muted); font-size: 0.72rem;
      margin: 24px 0 8px; opacity: 0.8;
    }

    /* ---- tabs ---- */
    nav.tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-around;
      background: rgba(11,13,17,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    }
    nav.tabs button {
      background: none; border: none; color: var(--muted);
      font-size: 0.66rem; font-weight: 550; font-family: inherit; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 2px 22px; letter-spacing: 0.04em;
      -webkit-tap-highlight-color: transparent;
    }
    nav.tabs button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    nav.tabs button.active { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header class="app">
      <h1>Gym<span>Fit</span></h1>
      <p>Tu rutina y tu dieta, a tu medida</p>
    </header>

    <!-- ============ RUTINA ============ -->
    <section id="view-rutina" class="view">
      <div id="rutina-content"></div>
    </section>

    <!-- ============ DIETA ============ -->
    <section id="view-dieta" class="view">
      <div id="dieta-content"></div>
    </section>

    <!-- ============ PERFIL ============ -->
    <section id="view-perfil" class="view">
      <div class="card">
        <span class="micro">Tu perfil</span>
        <p class="mutedtext">Con estos datos calculo tu rutina y tu dieta.</p>
        <form id="perfilForm">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Tu nombre" />
          <div class="row2">
            <div>
              <label for="edad">Edad</label>
              <input type="number" id="edad" min="12" max="99" required inputmode="numeric" placeholder="14" />
            </div>
            <div>
              <label for="sexo">Sexo</label>
              <select id="sexo">
                <option value="h">Hombre</option>
                <option value="m">Mujer</option>
              </select>
            </div>
          </div>
          <div class="row2">
            <div>
              <label for="peso">Peso · kg</label>
              <input type="number" id="peso" min="30" max="250" step="0.1" required inputmode="decimal" placeholder="60" />
            </div>
            <div>
              <label for="altura">Estatura · cm</label>
              <input type="number" id="altura" min="120" max="230" required inputmode="numeric" placeholder="170" />
            </div>
          </div>
          <label for="actividad">Actividad diaria (fuera del gym)</label>
          <select id="actividad">
            <option value="1.2">Sedentaria — casi todo el día sentado</option>
            <option value="1.375" selected>Ligera — camino, instituto o trabajo</option>
            <option value="1.55">Moderada — bastante movimiento</option>
            <option value="1.725">Alta — trabajo físico o mucho deporte</option>
          </select>
          <label for="objetivo">Objetivo</label>
          <select id="objetivo">
            <option value="perder">Perder grasa</option>
            <option value="mantener" selected>Mantenerme en forma</option>
            <option value="ganar">Ganar músculo</option>
          </select>
          <label for="dias">Días de gimnasio por semana</label>
          <select id="dias">
            <option value="3" selected>3 días</option>
            <option value="4">4 días</option>
            <option value="5">5 días</option>
          </select>
          <button type="submit" class="primary">Guardar y generar plan</button>
        </form>
        <button id="installBtn" class="ghost">Instalar la app en el móvil</button>
      </div>
      <footer>Los cálculos son orientativos y no sustituyen a un médico o nutricionista.</footer>
    </section>
  </div>

  <nav class="tabs">
    <button data-view="rutina" class="active">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      Rutina
    </button>
    <button data-view="dieta">
      <svg viewBox="0 0 24 24"><path d="M4 13h16M4 13a8 8 0 0 0 16 0M12 13V8.5M12 8.5c0-2 1.5-3.5 3.5-3.5 0 2-1.5 3.5-3.5 3.5Z"/></svg>
      Dieta
    </button>
    <button data-view="perfil">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c1.2-3 3.8-4.5 7-4.5s5.8 1.5 7 4.5"/></svg>
      Perfil
    </button>
  </nav>

<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "gymfit_profile";

/* ================= PERFIL ================= */
function loadProfile() {
  try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; }
}
function saveProfile(p) { localStorage.setItem(KEY, JSON.stringify(p)); }

$("#perfilForm").addEventListener("submit", e => {
  e.preventDefault();
  const p = {
    nombre: $("#nombre").value.trim(),
    edad: +$("#edad").value,
    sexo: $("#sexo").value,
    peso: +$("#peso").value,
    altura: +$("#altura").value,
    actividad: +$("#actividad").value,
    objetivo: $("#objetivo").value,
    dias: +$("#dias").value
  };
  saveProfile(p);
  render();
  showView("rutina");
});

function fillForm(p) {
  if (!p) return;
  $("#nombre").value = p.nombre || "";
  $("#edad").value = p.edad; $("#sexo").value = p.sexo;
  $("#peso").value = p.peso; $("#altura").value = p.altura;
  $("#actividad").value = p.actividad; $("#objetivo").value = p.objetivo;
  $("#dias").value = p.dias;
}

/* ================= RUTINAS ================= */
const RUTINAS = {
  3: [
    { nombre: "Full Body A", grupo: "Cuerpo completo", ejercicios: [
      ["Sentadilla con barra o mancuernas", "Piernas y glúteo", "4 × {R}"],
      ["Press de banca (o flexiones)", "Pecho, hombro y tríceps", "4 × {R}"],
      ["Remo con barra o mancuerna", "Espalda", "4 × {R}"],
      ["Press militar con mancuernas", "Hombros", "3 × {R}"],
      ["Plancha abdominal", "Core", "3 × 30-45 s"]
    ]},
    { nombre: "Full Body B", grupo: "Cuerpo completo", ejercicios: [
      ["Peso muerto rumano", "Femoral, glúteo y espalda baja", "4 × {R}"],
      ["Jalón al pecho (o dominadas asistidas)", "Espalda y bíceps", "4 × {R}"],
      ["Press inclinado con mancuernas", "Pecho superior", "3 × {R}"],
      ["Zancadas caminando", "Piernas", "3 × {R} / pierna"],
      ["Curl de bíceps con mancuernas", "Bíceps", "3 × {R}"]
    ]},
    { nombre: "Full Body C", grupo: "Cuerpo completo", ejercicios: [
      ["Prensa de piernas", "Cuádriceps y glúteo", "4 × {R}"],
      ["Fondos en paralelas (o en banco)", "Pecho y tríceps", "3 × {R}"],
      ["Remo en polea baja", "Espalda", "4 × {R}"],
      ["Elevaciones laterales", "Hombro lateral", "3 × {R}"],
      ["Crunch en polea o abdominales", "Core", "3 × 15-20"]
    ]}
  ],
  4: [
    { nombre: "Torso A", grupo: "Pecho · Espalda · Hombro", ejercicios: [
      ["Press de banca", "Pecho", "4 × {R}"],
      ["Remo con barra", "Espalda", "4 × {R}"],
      ["Press militar", "Hombros", "3 × {R}"],
      ["Jalón al pecho", "Dorsal", "3 × {R}"],
      ["Curl de bíceps + extensión de tríceps", "Brazos, superserie", "3 × {R}"]
    ]},
    { nombre: "Pierna A", grupo: "Piernas y core", ejercicios: [
      ["Sentadilla con barra", "Cuádriceps y glúteo", "4 × {R}"],
      ["Peso muerto rumano", "Femoral y glúteo", "4 × {R}"],
      ["Prensa de piernas", "Piernas", "3 × {R}"],
      ["Elevación de gemelos", "Gemelos", "4 × 15-20"],
      ["Plancha abdominal", "Core", "3 × 30-45 s"]
    ]},
    { nombre: "Torso B", grupo: "Pecho · Espalda · Hombro", ejercicios: [
      ["Press inclinado con mancuernas", "Pecho superior", "4 × {R}"],
      ["Dominadas (o jalón agarre estrecho)", "Espalda", "4 × {R}"],
      ["Elevaciones laterales", "Hombro lateral", "4 × {R}"],
      ["Remo en polea baja", "Espalda media", "3 × {R}"],
      ["Curl martillo + fondos en banco", "Brazos, superserie", "3 × {R}"]
    ]},
    { nombre: "Pierna B", grupo: "Piernas y core", ejercicios: [
      ["Zancadas con mancuernas", "Piernas y glúteo", "4 × {R} / pierna"],
      ["Hip thrust", "Glúteo", "4 × {R}"],
      ["Curl femoral en máquina", "Femoral", "3 × {R}"],
      ["Extensión de cuádriceps", "Cuádriceps", "3 × {R}"],
      ["Crunch abdominal", "Core", "3 × 15-20"]
    ]}
  ],
  5: [
    { nombre: "Empuje · Push", grupo: "Pecho · Hombro · Tríceps", ejercicios: [
      ["Press de banca", "Pecho", "4 × {R}"],
      ["Press militar con mancuernas", "Hombros", "4 × {R}"],
      ["Press inclinado", "Pecho superior", "3 × {R}"],
      ["Elevaciones laterales", "Hombro lateral", "3 × {R}"],
      ["Extensión de tríceps en polea", "Tríceps", "3 × {R}"]
    ]},
    { nombre: "Tirón · Pull", grupo: "Espalda · Bíceps", ejercicios: [
      ["Dominadas (o jalón al pecho)", "Dorsal", "4 × {R}"],
      ["Remo con barra", "Espalda media", "4 × {R}"],
      ["Remo en polea baja", "Espalda", "3 × {R}"],
      ["Face pull", "Hombro posterior", "3 × {R}"],
      ["Curl de bíceps con barra", "Bíceps", "3 × {R}"]
    ]},
    { nombre: "Pierna", grupo: "Piernas y core", ejercicios: [
      ["Sentadilla con barra", "Cuádriceps y glúteo", "4 × {R}"],
      ["Peso muerto rumano", "Femoral", "4 × {R}"],
      ["Prensa de piernas", "Piernas", "3 × {R}"],
      ["Elevación de gemelos", "Gemelos", "4 × 15-20"],
      ["Plancha abdominal", "Core", "3 × 30-45 s"]
    ]},
    { nombre: "Torso", grupo: "Pecho y espalda", ejercicios: [
      ["Press inclinado con mancuernas", "Pecho superior", "4 × {R}"],
      ["Remo con mancuerna a una mano", "Espalda", "4 × {R}"],
      ["Aperturas en polea o mancuernas", "Pecho", "3 × {R}"],
      ["Jalón al pecho agarre estrecho", "Dorsal", "3 × {R}"],
      ["Curl martillo + press francés", "Brazos, superserie", "3 × {R}"]
    ]},
    { nombre: "Pierna y Core", grupo: "Piernas, glúteo y abdomen", ejercicios: [
      ["Hip thrust", "Glúteo", "4 × {R}"],
      ["Zancadas caminando", "Piernas", "3 × {R} / pierna"],
      ["Curl femoral", "Femoral", "3 × {R}"],
      ["Extensión de cuádriceps", "Cuádriceps", "3 × {R}"],
      ["Elevaciones de piernas colgado", "Abdomen", "3 × 10-15"]
    ]}
  ]
};

const DIAS_SEMANA = { 3: [1, 3, 5], 4: [1, 2, 4, 5], 5: [1, 2, 3, 4, 5] }; // 1=lunes
const NOMBRE_DIA = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

function esquema(objetivo) {
  if (objetivo === "perder")  return { reps: "12-15", descanso: "45-60 s", nota: "Ritmo alto y descansos cortos para quemar más. Añade 15-20 min de cardio al acabar si puedes." };
  if (objetivo === "ganar")   return { reps: "8-12",  descanso: "60-90 s", nota: "Sube el peso poco a poco cada semana (sobrecarga progresiva) manteniendo buena técnica." };
  return { reps: "10-12", descanso: "60 s", nota: "Constancia ante todo: mejor entrenar siempre que entrenar mucho una semana y nada la siguiente." };
}

function renderRutina(p) {
  const cont = $("#rutina-content");
  if (!p) {
    cont.innerHTML = `<div class="card center-msg">
      <p>Para crear tu rutina necesito conocerte.</p>
      <button class="primary" onclick="showView('perfil')">Completar mi perfil</button></div>`;
    return;
  }
  const plan = RUTINAS[p.dias];
  const esq = esquema(p.objetivo);
  const diasGym = DIAS_SEMANA[p.dias];
  const hoy = new Date().getDay(); // 0=domingo
  const idxHoy = diasGym.indexOf(hoy); // -1 si hoy es descanso

  let html = `<div class="card hero">
    <span class="micro">Hoy · ${NOMBRE_DIA[hoy]}</span>
    <h2>${idxHoy >= 0 ? plan[idxHoy].nombre : "Descanso"}</h2>
    <p class="sub">${idxHoy >= 0 ? plan[idxHoy].grupo : "Recuperarse también es entrenar."}</p>
    <div class="meta">
      <div><b>${esq.descanso}</b><span>Descanso entre series</span></div>
      <div><b>5-10 min</b><span>Calentamiento previo</span></div>
    </div>
  </div>`;

  html += `<div class="card"><span class="micro">Tu semana · ${p.dias} días</span>`;
  plan.forEach((dia, i) => {
    const diaSem = diasGym[i];
    const esHoy = diaSem === hoy;
    const ejercicios = dia.ejercicios.map(e =>
      `<div class="ex"><div class="n">${e[0]}<small>${e[1]}</small></div><div class="sr">${e[2].replace("{R}", esq.reps)}</div></div>`
    ).join("");
    html += `<div class="day${esHoy ? " today open" : ""}">
      <div class="head" onclick="this.parentElement.classList.toggle('open')">
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <div class="info"><strong>${dia.nombre}</strong><small>${NOMBRE_DIA[diaSem]} · ${dia.grupo}</small></div>
        ${esHoy ? '<span class="mark">HOY</span>' : ""}
        <span class="chev"></span>
      </div>
      <div class="body">${ejercicios}</div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="card"><span class="micro">Consejo</span><p class="mutedtext">${esq.nota}</p></div>`;
  cont.innerHTML = html;
}

/* ================= DIETA ================= */
function calcDieta(p) {
  const alturaM = p.altura / 100;
  const imc = p.peso / (alturaM * alturaM);
  // Mifflin-St Jeor
  let tmb = 10 * p.peso + 6.25 * p.altura - 5 * p.edad + (p.sexo === "h" ? 5 : -161);
  const tdee = tmb * p.actividad;
  const menor = p.edad < 18;
  let kcal = tdee;
  if (p.objetivo === "perder") kcal = menor ? tdee : tdee * 0.85; // sin déficit para menores
  if (p.objetivo === "ganar")  kcal = tdee * 1.10;
  kcal = Math.round(kcal / 10) * 10;

  const gProt = { perder: 2.0, mantener: 1.6, ganar: 1.8 }[p.objetivo];
  const prot = Math.round(gProt * p.peso);
  const grasa = Math.round(kcal * 0.27 / 9);
  const carbs = Math.max(0, Math.round((kcal - prot * 4 - grasa * 9) / 4));
  return { imc, tmb: Math.round(tmb), tdee: Math.round(tdee), kcal, prot, grasa, carbs, menor };
}

function imcCategoria(imc) {
  if (imc < 18.5) return "Bajo peso";
  if (imc < 25)   return "Peso saludable";
  if (imc < 30)   return "Sobrepeso";
  return "Obesidad";
}

function tierKcal(kcal) { return kcal < 2100 ? 0 : kcal < 2600 ? 1 : 2; }

function menuDelDia(dia, kcal) {
  const t = tierKcal(kcal);
  return MENU_SEMANA[dia][1].map(([nombre, texto]) =>
    [nombre, texto.replace(/\{([^}]*)\}/g, (_, opts) => opts.split("|")[t])]
  );
}

let diaSel = (new Date().getDay() + 6) % 7; // 0 = lunes
window.setDia = i => { diaSel = i; render(); };

function renderDieta(p) {
  const cont = $("#dieta-content");
  if (!p) {
    cont.innerHTML = `<div class="card center-msg">
      <p>Necesito tu edad, peso y estatura para calcular tu dieta.</p>
      <button class="primary" onclick="showView('perfil')">Completar mi perfil</button></div>`;
    return;
  }
  const d = calcDieta(p);
  const cat = imcCategoria(d.imc);
  const pos = Math.min(97, Math.max(3, ((d.imc - 14) / 21) * 100)); // escala visual 14-35
  const objetivoTxt = { perder: "perder grasa", mantener: "mantenerte en forma", ganar: "ganar músculo" }[p.objetivo];

  let html = "";
  if (d.menor) {
    html += `<div class="notice"><b>Menor de 18 años.</b> Como estás creciendo, tu plan no incluye recortes de calorías.
    Lo importante a tu edad es comer variado, suficiente y entrenar bien. Consulta con tu médico antes de hacer cambios grandes en tu alimentación.</div>`;
  }

  html += `<div class="card">
    <span class="micro">Tus números${p.nombre ? " · " + p.nombre : ""}</span>
    <div class="stats">
      <div class="stat"><div class="v">${d.kcal}<em>kcal</em></div><div class="l">Objetivo diario</div></div>
      <div class="stat"><div class="v">${d.imc.toFixed(1)}</div><div class="l">IMC</div></div>
      <div class="stat"><div class="v">${d.tmb}<em>kcal</em></div><div class="l">Metabolismo basal</div></div>
      <div class="stat"><div class="v">${d.tdee}<em>kcal</em></div><div class="l">Gasto diario total</div></div>
    </div>
    <div class="imc-bar"><div class="imc-dot" style="left:${pos}%"></div></div>
    <p class="imc-cat"><b>${cat}</b> · calorías ajustadas para ${objetivoTxt}</p>
  </div>`;

  html += `<div class="card">
    <span class="micro">Macros diarios</span>
    <div class="macros">
      <div class="macro"><b>${d.prot}<em> g</em></b><span>Proteína</span></div>
      <div class="macro"><b>${d.carbs}<em> g</em></b><span>Carbos</span></div>
      <div class="macro"><b>${d.grasa}<em> g</em></b><span>Grasas</span></div>
    </div>
  </div>`;

  const chips = MENU_SEMANA.map((m, i) =>
    `<button class="chip${i === diaSel ? " active" : ""}" onclick="setDia(${i})">${m[0][0] === "M" && i === 2 ? "X" : m[0][0]}</button>`
  ).join("");
  const menu = menuDelDia(diaSel, d.kcal).map(m => `<div class="meal"><b>${m[0]}</b><p>${m[1]}</p></div>`).join("");
  html += `<div class="card">
    <span class="micro">Menú semanal · ~${d.kcal} kcal/día</span>
    <div class="chips">${chips}</div>
    <p class="mutedtext" style="margin-bottom:4px; font-weight:600; color:var(--txt); font-size:0.9rem;">${MENU_SEMANA[diaSel][0]}</p>
    ${menu}
  </div>`;

  html += `<div class="card"><span class="micro">Recuerda</span>
    <p class="mutedtext">La proteína (pollo, pescado, huevos, legumbres, lácteos) es clave para recuperar el músculo.
    Bebe 1,5-2 litros de agua al día y deja los refrescos azucarados y ultraprocesados para ocasiones puntuales.</p>
  </div>`;

  html += `<footer>Estos cálculos son orientativos y no sustituyen el consejo de un médico o nutricionista.</footer>`;
  cont.innerHTML = html;
}

/* ================= NAVEGACIÓN ================= */
function showView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
  $("#view-" + name).classList.add("active");
  window.scrollTo({ top: 0 });
}
document.querySelectorAll("nav.tabs button").forEach(b =>
  b.addEventListener("click", () => showView(b.dataset.view)));

function render() {
  const p = loadProfile();
  fillForm(p);
  renderRutina(p);
  renderDieta(p);
}
render();
showView(loadProfile() ? "rutina" : "perfil");

/* ================= PWA ================= */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  $("#installBtn").style.display = "block";
});
$("#installBtn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $("#installBtn").style.display = "none";
});
</script>
